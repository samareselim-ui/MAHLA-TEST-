name: Build signed MAHLA release APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets
        env:
          MAHLA_KEYSTORE_BASE64: ${{ secrets.MAHLA_KEYSTORE_BASE64 }}
          MAHLA_KEYSTORE_PASSWORD: ${{ secrets.MAHLA_KEYSTORE_PASSWORD }}
          MAHLA_KEY_ALIAS: ${{ secrets.MAHLA_KEY_ALIAS }}
          MAHLA_KEY_PASSWORD: ${{ secrets.MAHLA_KEY_PASSWORD }}
        run: |
          test -n "$MAHLA_KEYSTORE_BASE64"
          test -n "$MAHLA_KEYSTORE_PASSWORD"
          test -n "$MAHLA_KEY_ALIAS"
          test -n "$MAHLA_KEY_PASSWORD"

      - name: Restore private signing key
        env:
          MAHLA_KEYSTORE_BASE64: ${{ secrets.MAHLA_KEYSTORE_BASE64 }}
        run: |
          echo "$MAHLA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mahla-release-key.jks"
          test -s "$RUNNER_TEMP/mahla-release-key.jks"

      - name: Build signed owner and client APKs
        env:
          MAHLA_KEYSTORE_FILE: ${{ runner.temp }}/mahla-release-key.jks
          MAHLA_KEYSTORE_PASSWORD: ${{ secrets.MAHLA_KEYSTORE_PASSWORD }}
          MAHLA_KEY_ALIAS: ${{ secrets.MAHLA_KEY_ALIAS }}
          MAHLA_KEY_PASSWORD: ${{ secrets.MAHLA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleOwnerRelease :app:assembleClientRelease
          mkdir -p release-apks
          cp app/build/outputs/apk/owner/release/*.apk release-apks/MAHLA-owner.apk
          cp app/build/outputs/apk/client/release/*.apk release-apks/MAHLA-client.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mahla-signed-release-apks
          path: release-apks/*.apk
          if-no-files-found: error
