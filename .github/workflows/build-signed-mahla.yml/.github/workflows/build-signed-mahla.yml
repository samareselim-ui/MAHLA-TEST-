
name: Build Signed MAHLA APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets
        env:
          KEYSTORE: ${{ secrets.MAHLA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MAHLA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAHLA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAHLA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.MAHLA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mahla-release-key.jks"
          test -s "$RUNNER_TEMP/mahla-release-key.jks"

      - name: Build signed Owner and Client APKs
        working-directory: MAHLA_Android_Project
        env:
          MAHLA_KEYSTORE_FILE: ${{ runner.temp }}/mahla-release-key.jks
          MAHLA_KEYSTORE_PASSWORD: ${{ secrets.MAHLA_KEYSTORE_PASSWORD }}
          MAHLA_KEY_ALIAS: ${{ secrets.MAHLA_KEY_ALIAS }}
          MAHLA_KEY_PASSWORD: ${{ secrets.MAHLA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleOwnerRelease :app:assembleClientRelease
          mkdir -p release-apks
          cp app/build/outputs/apk/owner/release/*.apk release-apks/MAHLA-owner.apk
          cp app/build/outputs/apk/client/release/*.apk release-apks/MAHLA-client.apk

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: mahla-signed-release-apks
          path: MAHLA_Android_Project/release-apks/*.apk
          if-no-files-found: error
          
