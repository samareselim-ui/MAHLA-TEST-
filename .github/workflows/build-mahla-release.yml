
name: Build signed MAHLA APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MAHLA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing MAHLA_KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mahla-release-key.jks"

      - name: Build signed Owner and Client APKs
        working-directory: MAHLA_Android_Project
        env:
          MAHLA_KEYSTORE_FILE: ${{ runner.temp }}/mahla-release-key.jks
          MAHLA_KEYSTORE_PASSWORD: ${{ secrets.MAHLA_KEYSTORE_PASSWORD }}
          MAHLA_KEY_ALIAS: ${{ secrets.MAHLA_KEY_ALIAS }}
          MAHLA_KEY_PASSWORD: ${{ secrets.MAHLA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleOwnerRelease :app:assembleClientRelease
          mkdir -p release-apks
          cp app/build/outputs/apk/owner/release/app-owner-release.apk release-apks/MAHLA-owner.apk
          cp app/build/outputs/apk/client/release/app-client-release.apk release-apks/MAHLA-client.apk

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: mahla-signed-release-apks
          path: MAHLA_Android_Project/release-apks/*.apk
          if-no-files-found: error
          
