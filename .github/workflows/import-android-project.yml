
name: Import MAHLA Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract Android project ZIP
        run: |
          set -e
          mkdir -p /tmp/mahla-import
          unzip -q MAHLA_Android_Project_RELEASE_SIGNING_READY.zip -d /tmp/mahla-import
          test -d /tmp/mahla-import/MAHLA_Android_Project
          rm -rf MAHLA_Android_Project
          cp -a /tmp/mahla-import/MAHLA_Android_Project ./MAHLA_Android_Project
          test -f MAHLA_Android_Project/app/build.gradle.kts

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAHLA_Android_Project
          git commit -m "Import MAHLA Android project from ZIP" || exit 0
          git push
          
